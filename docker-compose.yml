services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mlserve
      POSTGRES_PASSWORD: mlserve
      POSTGRES_DB: mlserve
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U mlserve"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://mlserve:mlserve@db:5432/mlserve
      REDIS_URL: redis://cache:6379
      MODEL_DIR: /app/models
    volumes:
      - "modeldata:/app/models"
    
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: python -m services.worker.worker
    depends_on:
      cache:
        condition: service_healthy
    environment:
      REDIS_URL: redis://cache:6379
      MODEL_DIR: /app/models
    volumes:
      - "modeldata:/app/models"

  gateway:
    build:
      context: ./services/gateway
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_started
    environment:
      UPSTREAM_URL: http://app:8000
      REDIS_URL: cache:6379
      API_KEYS: "test-key-1,test-key-2"
      RATE_LIMIT_RPS: "10"
      RATE_LIMIT_BURST: "100"
        
volumes:
  pgdata:
  modeldata: